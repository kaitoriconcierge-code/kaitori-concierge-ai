<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#eef7ff">
<title>シマエナガ漢字テスト</title>
<style>
:root{
  --bg:#f5fbff;--card:#fff;--ink:#263244;--sub:#6b7788;--line:#dce8f2;
  --blue:#5f9cf3;--orange:#f39c12;--green:#27ae60;--red:#e74c3c;--pink:#ffb8c8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
background:linear-gradient(180deg,#edf8ff 0%,#fff9fb 100%);color:var(--ink);min-height:100vh}
.wrap{max-width:980px;margin:0 auto;padding:14px 14px 40px}
.header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.bird{
  width:64px;height:64px;border-radius:50%;background:white;border:2px solid #dbe7ef;
  box-shadow:0 8px 22px rgba(50,90,130,.12);display:grid;place-items:center;font-size:34px
}
h1{font-size:clamp(24px,5vw,36px);margin:0}.sub{font-size:13px;color:var(--sub)}
.card{background:rgba(255,255,255,.97);border:1px solid #e5edf4;border-radius:22px;padding:18px;
box-shadow:0 10px 30px rgba(40,80,120,.08);margin-bottom:14px;position:relative}
.hidden{display:none!important}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.field label{display:block;font-size:13px;color:var(--sub);margin:0 0 6px 4px}
select,button,input{
  width:100%;border-radius:14px;font-size:17px;font-weight:700;
  touch-action:manipulation;-webkit-appearance:none;appearance:none
}
select{padding:14px;background:#f3f8fc;border:1px solid var(--line);color:var(--ink)}
button{border:none;padding:15px;color:white;background:var(--blue);min-height:56px;cursor:pointer}
button.secondary{background:#eef4f8;color:var(--ink);border:1px solid var(--line)}
button.danger{background:#fff0f0;color:#b33;border:1px solid #ffd6d6}
button.orange{background:var(--orange)}
button.green{background:var(--green)}
button.red{background:var(--red)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{background:#f7fafc;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:24px}
.progress{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.bar{flex:1;height:10px;background:#edf2f6;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}
.qbox{text-align:center;padding:6px 0 12px}
.badge{display:inline-block;padding:6px 12px;border-radius:99px;background:#edf4ff;color:#3563a9;font-size:13px;font-weight:800}
.sentence{font-size:clamp(24px,5.5vw,40px);font-weight:850;line-height:1.7;margin:12px 0}
.focus{font-size:clamp(40px,8vw,62px);font-weight:900;margin:6px 0}
.hint{font-size:15px;color:var(--sub)}
.answerInput{
  height:112px;border:3px solid #cfe0ef;background:white;font-size:52px;text-align:center;
  padding:10px;outline:none;-webkit-user-select:text;user-select:text
}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.resultBox{margin-top:14px;padding:16px;border-radius:18px;background:#fff8dd;border:1px solid #ffe49a;text-align:center}
.resultMsg{font-size:30px;font-weight:900}
.answerStrong{font-size:36px}
.mascot{display:flex;align-items:center;gap:10px;margin:12px 0;padding:12px;border-radius:16px;background:#fff7fb;border:1px solid #ffdce6}
.mascot .face{font-size:32px}.mascot .speech{font-weight:800}
.bigScore{text-align:center;font-size:72px;font-weight:900;color:var(--blue);line-height:1}
.list{display:grid;gap:8px;margin-top:12px}
.item{padding:12px;border:1px solid var(--line);border-radius:14px;background:#f8fafc}
.small{font-size:12px;color:var(--sub);line-height:1.6}
@media(max-width:650px){
  .grid{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr 1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="bird">🐦</div>
    <div><h1>シマエナガ漢字テスト</h1><div class="sub">iPad・Apple Pencil対応 / 小1〜中3</div></div>
  </div>

  <section id="home" class="card">
    <div class="grid">
      <div class="field">
        <label>学年</label>
        <select id="grade">
          <option value="1">小学1年生</option><option value="2">小学2年生</option>
          <option value="3">小学3年生</option><option value="4">小学4年生</option>
          <option value="5">小学5年生</option><option value="6">小学6年生</option>
          <option value="7">中学1年生</option><option value="8">中学2年生</option>
          <option value="9">中学3年生</option>
        </select>
      </div>
      <div class="field">
        <label>問題数</label>
        <select id="count"><option>5</option><option selected>10</option><option>20</option></select>
      </div>
      <div class="field">
        <label>テストの種類</label>
        <select id="mode">
          <option value="write">漢字を書く</option>
          <option value="read">読み方を書く</option>
          <option value="mix" selected>ミックス</option>
        </select>
      </div>
      <div class="field">
        <label>出題</label>
        <select id="source">
          <option value="all" selected>通常テスト</option>
          <option value="wrong">まちがい復習</option>
        </select>
      </div>
    </div>
    <button type="button" id="start" style="margin-top:14px;font-size:22px;min-height:68px">テストをはじめる</button>

    <div class="mascot"><div class="face">🐦</div><div class="speech" id="homeSpeech">きょうもいっしょに がんばろう！</div></div>

    <div class="stats">
      <div class="stat"><span>テスト回数</span><b id="statTests">0</b></div>
      <div class="stat"><span>平均点</span><b id="statAvg">--</b></div>
      <div class="stat"><span>苦手</span><b id="statWrong">0</b></div>
    </div>
    <div class="small" style="margin-top:10px">
      Apple Pencilは入力欄をタップしてから書いてください。読み方問題は【 】内の漢字部分だけを答えます。
      成績と間違い問題はこのiPadのブラウザ内に保存されます。
    </div>
  </section>

  <section id="test" class="card hidden">
    <div class="progress">
      <b id="counter">1 / 10</b><div class="bar"><i id="bar" style="width:0%"></i></div><b id="miniScore">0点</b>
    </div>
    <div class="qbox">
      <div id="typeBadge" class="badge">書き取り問題</div>
      <div id="instruction" class="sub" style="margin-top:8px">【 】のことばを漢字で書きましょう</div>
      <div id="sentence" class="sentence"></div>
      <div id="focus" class="focus"></div>
      <div id="hint" class="hint"></div>
    </div>

    <input id="textAnswer" class="answerInput" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" inputmode="text" placeholder="ここに書く">
    <button type="button" id="judgeBtn" class="orange" style="margin-top:12px;font-size:22px;min-height:68px">判定する</button>

    <div id="answerBox" class="resultBox hidden">
      <div id="judgeMessage" class="resultMsg"></div>
      <div>こたえ：<strong id="answerText" class="answerStrong"></strong></div>
      <div class="actions">
        <button type="button" id="nextBtn" class="green">次の問題へ</button>
        <button type="button" id="retryBtn" class="red">もう一回</button>
      </div>
    </div>

    <div class="mascot"><div class="face">🐦</div><div class="speech" id="testSpeech">ゆっくり、ていねいに書こう！</div></div>
  </section>

  <section id="result" class="card hidden">
    <div class="bigScore" id="finalScore">100点</div>
    <div id="resultText" style="text-align:center;font-size:20px;font-weight:850;margin-top:8px"></div>
    <div class="mascot"><div class="face">🐦</div><div class="speech" id="resultSpeech"></div></div>
    <div id="mistakes" class="list"></div>
    <div class="actions" style="margin-top:14px">
      <button type="button" id="reviewBtn" class="secondary">まちがいを復習</button>
      <button type="button" id="homeBtn">ホームにもどる</button>
    </div>
  </section>
</div>

const gradeNames={1:"小学1年生",2:"小学2年生",3:"小学3年生",4:"小学4年生",5:"小学5年生",6:"小学6年生",7:"中学1年生",8:"中学2年生",9:"中学3年生"};
const $=id=>document.getElementById(id);
const shuffle=a=>[...a].sort(()=>Math.random()-.5);

let questions=[],idx=0,correctCount=0,wrongs=[],testMode="mix",currentGrade="1",answered=false;

function loadStore(){
  try{return JSON.parse(localStorage.getItem("shimaKanjiData")||'{"tests":[],"wrongs":{}}')}catch(e){return {tests:[],wrongs:{}}}
}
function saveStore(d){localStorage.setItem("shimaKanjiData",JSON.stringify(d))}
function qKey(q){return [q.grade,q.reading,q.answer,q.sentence,q.type].join("|")}

function updateStats(){
  const d=loadStore(), g=$("grade").value;
  const tests=d.tests.filter(x=>String(x.grade)===String(g));
  $("statTests").textContent=tests.length;
  $("statAvg").textContent=tests.length?Math.round(tests.reduce((s,x)=>s+x.score,0)/tests.length)+"点":"--";
  const ws=(d.wrongs[g]||[]);
  $("statWrong").textContent=ws.length;
  $("homeSpeech").textContent=tests.length?`${gradeNames[g]}、つづけて がんばろう！`:"きょうもいっしょに がんばろう！";
}
$("grade").addEventListener("change",updateStats);

function buildQuestion(raw,type,grade){
  return {reading:raw[0],answer:raw[1],sentence:raw[2],type,grade:String(grade)}
}
function startTest(){
  currentGrade=$("grade").value;
  testMode=$("mode").value;
  const n=Number($("count").value);
  const source=$("source").value;
  let pool=[];

  if(source==="wrong"){
    const d=loadStore();
    pool=(d.wrongs[currentGrade]||[]).map(x=>({...x}));
    if(!pool.length){
      alert("この学年の復習問題はまだありません。まず通常テストをしてみよう！");
      return;
    }
  }else{
    const base=shuffle(BANK[currentGrade]||[]);
    pool=base.map((q,i)=>{
      let t=testMode;
      if(t==="mix") t=i%2===0?"write":"read";
      return buildQuestion(q,t,currentGrade);
    });
  }

  questions=shuffle(pool).slice(0,Math.min(n,pool.length));
  idx=0;correctCount=0;wrongs=[];
  $("home").classList.add("hidden");$("result").classList.add("hidden");$("test").classList.remove("hidden");
  window.scrollTo({top:0,behavior:"smooth"});
  loadQ();
}
$("start").addEventListener("click",startTest);

function displaySentence(q){
  return q.type==="read" ? q.sentence.replace(/【[^】]+】/,`【${q.answer}】`) : q.sentence;
}
function expectedAnswer(){const q=questions[idx];return q.type==="write"?q.answer:q.reading}
function normalize(s){return (s||"").normalize("NFKC").replace(/[\s　]/g,"").trim()}

function loadQ(){
  answered=false;
  const q=questions[idx];
  $("counter").textContent=`${idx+1} / ${questions.length}`;
  $("bar").style.width=`${(idx/questions.length)*100}%`;
  $("miniScore").textContent=`${Math.round(correctCount/questions.length*100)}点`;
  $("answerBox").classList.add("hidden");
  $("textAnswer").value="";
  $("nextBtn").classList.add("hidden");
  $("retryBtn").classList.remove("hidden");

  if(q.type==="write"){
    $("typeBadge").textContent="書き取り問題";
    $("instruction").textContent="【 】のことばを漢字で書きましょう";
    $("sentence").textContent=q.sentence;
    $("focus").textContent=q.reading;
    $("hint").textContent=`「${q.reading}」を漢字で書こう`;
  }else{
    $("typeBadge").textContent="読み方問題";
    $("instruction").textContent="【 】の漢字の読み方をひらがなで書きましょう";
    $("sentence").textContent=displaySentence(q);
    $("focus").textContent=q.answer;
    $("hint").textContent=`「${q.answer}」の読み方を書こう`;
  }
  $("testSpeech").textContent=["ゆっくり、ていねいに書こう！","よく文章を見てね！","できるよ、がんばって！"][idx%3];
}

function runJudge(){
  if(answered) return;
  const user=normalize($("textAnswer").value), expected=normalize(expectedAnswer());
  if(!user){
    $("answerBox").classList.remove("hidden");
    $("judgeMessage").textContent="✍️ まず答えを書いてね";
    $("judgeMessage").style.color="#d68910";
    $("answerText").textContent=expectedAnswer();
    $("nextBtn").classList.add("hidden");
    $("retryBtn").classList.remove("hidden");
    return;
  }
  const ok=user===expected;
  answered=true;
  $("answerBox").classList.remove("hidden");
  $("answerText").textContent=expectedAnswer();
  $("nextBtn").classList.remove("hidden");

  if(ok){
    correctCount++;
    $("judgeMessage").textContent="⭕ 正解！";
    $("judgeMessage").style.color="#27ae60";
    $("retryBtn").classList.add("hidden");
    $("testSpeech").textContent="すごい！そのちょうし！";
  }else{
    $("judgeMessage").textContent="❌ ちがいます";
    $("judgeMessage").style.color="#e74c3c";
    $("retryBtn").classList.remove("hidden");
    wrongs.push({...questions[idx]});
    $("testSpeech").textContent="だいじょうぶ！もう一回おぼえよう！";
  }
  $("miniScore").textContent=`${Math.round(correctCount/questions.length*100)}点`;
}
$("judgeBtn").addEventListener("click",runJudge);
$("textAnswer").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();runJudge()}});

$("retryBtn").addEventListener("click",()=>{
  answered=false;$("answerBox").classList.add("hidden");$("textAnswer").value="";
});
$("nextBtn").addEventListener("click",()=>{
  idx++;
  if(idx>=questions.length) finish(); else loadQ();
});

function finish(){
  const score=Math.round(correctCount/questions.length*100);
  const d=loadStore();
  d.tests.push({grade:currentGrade,score,date:new Date().toISOString()});
  d.tests=d.tests.slice(-100);

  if(!d.wrongs[currentGrade]) d.wrongs[currentGrade]=[];
  for(const q of wrongs){
    if(!d.wrongs[currentGrade].some(x=>qKey(x)===qKey(q))) d.wrongs[currentGrade].push(q);
  }
  if(score===100){
    const usedKeys=new Set(questions.map(q=>qKey(q)));
    d.wrongs[currentGrade]=d.wrongs[currentGrade].filter(x=>!usedKeys.has(qKey(x)));
  }
  saveStore(d);

  $("test").classList.add("hidden");$("result").classList.remove("hidden");
  $("finalScore").textContent=score+"点";
  $("resultText").textContent=score===100?"パーフェクト！":score>=80?"とてもよくできました！":score>=60?"あと少し！復習しよう":"まちがいを復習してもう一回！";
  $("resultSpeech").textContent=score===100?"ぜんぶ正解！すごい！🎉":score>=80?"とってもよくがんばったね！": "まちがいは成長のチャンスだよ！";

  const box=$("mistakes");box.innerHTML="";
  if(!wrongs.length){
    box.innerHTML='<div class="item">まちがいはありません！</div>';
  }else{
    const h=document.createElement("div");h.style.fontWeight="900";h.textContent="今回まちがえた問題";box.appendChild(h);
    wrongs.forEach(q=>{
      const d=document.createElement("div");d.className="item";
      d.innerHTML=`${q.type==="write"?"書き取り":"読み方"}：${displaySentence(q)}<br><b>${expectedFor(q)}</b>`;
      box.appendChild(d);
    });
  }
  $("reviewBtn").disabled=!wrongs.length;
  updateStats();
}
function expectedFor(q){return q.type==="write"?q.answer:q.reading}

$("reviewBtn").addEventListener("click",()=>{
  if(!wrongs.length)return;
  questions=shuffle(wrongs.map(x=>({...x})));idx=0;correctCount=0;wrongs=[];
  $("result").classList.add("hidden");$("test").classList.remove("hidden");loadQ();
});
$("homeBtn").addEventListener("click",()=>{
  $("result").classList.add("hidden");$("test").classList.add("hidden");$("home").classList.remove("hidden");
  updateStats();window.scrollTo({top:0,behavior:"smooth"});
});

updateStats();
</script>
